<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<meta name="description" content="Sherlock Holmes in Berlin – Fall 1: Der Uhrmacher von der Rosenthaler Straße. Ein Detektivspiel im Browser für PC und Smartphone, Berlin 1892.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sherlock Holmes in Berlin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl" aria-label="Spielszene"></canvas>
<div id="fx" aria-hidden="true"></div>
<div id="markers" class="hidden"></div>
<div id="hover-label" class="hidden" aria-hidden="true"></div>

<header id="hud" class="hidden">
  <div class="hud-loc">
    <b id="loc-name"></b>
    <span id="loc-time"></span>
    <p id="objective"></p>
  </div>
  <nav class="hud-btns" aria-label="Werkzeuge">
    <button id="btn-look" title="Lupe – alles Wichtige hervorheben (L)" aria-label="Lupe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14.6 14.6l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M7 8.2a3.4 3.4 0 0 1 3-2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".7"/></svg>
      <span>Lupe</span>
    </button>
    <button id="btn-hint" title="Paule um Rat fragen (H)" aria-label="Paule fragen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10.5H11l-5 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.6 9a2.4 2.4 0 1 1 3.4 2.2c-.7.3-1 .8-1 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="14.6" r="1" fill="currentColor"/></svg>
      <span>Paule</span>
    </button>
    <button id="btn-book" title="Notizbuch (N)" aria-label="Notizbuch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11.5A2.5 2.5 0 0 1 19 6.5V20H7.5A2.5 2.5 0 0 1 5 17.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 11h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Notizbuch</span>
      <i class="badge hidden"></i>
    </button>
    <button id="btn-menu" title="Menü (Esc)" aria-label="Menü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Menü</span>
    </button>
  </nav>
</header>

<div id="dialog" class="hidden" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<div id="panel" class="hidden"></div>

<section id="title" class="hidden" aria-label="Titelbild">
  <div class="t-card">
    <div class="t-kicker">Berlin · November 1892</div>
    <h1>Sherlock Holmes <span>in Berlin</span></h1>
    <div class="t-rule" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="t-case"><small>Fall 1</small>Der Uhrmacher von der Rosenthaler Straße</p>
    <div class="t-btns">
      <button id="t-continue" class="btn gold hidden">Fortsetzen</button>
      <button id="t-new" class="btn gold">Neues Spiel</button>
      <button id="t-settings" class="btn">Einstellungen</button>
      <button id="t-about" class="btn">Über das Spiel</button>
    </div>
  </div>
  <p class="t-foot">Mit Ton am schönsten · Tippen oder Klicken genügt</p>
</section>

<div id="menu" class="hidden"></div>
<div id="fade" class="on loading">
  <div class="loader" role="status">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="27" fill="#efe6cf" stroke="#c9a45a" stroke-width="4"/>
      <g stroke="#2a2018" stroke-width="2" stroke-linecap="round">
        <path d="M32 9v4M32 51v4M9 32h4M51 32h4"/>
      </g>
      <path class="hand-h" d="M32 32V20" stroke="#2a2018" stroke-width="3.2" stroke-linecap="round"/>
      <path class="hand-m" d="M32 32V13" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="2.4" fill="#c9a45a"/>
    </svg>
    <span>Berlin, 1892 …</span>
  </div>
</div>
<div id="overlay" class="hidden"></div>
<div id="error" class="hidden" role="alert"></div>
<noscript><div class="noscript">Dieses Spiel braucht JavaScript.</div></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
